version: '3.8'

services:
  # ===========================================
  # API Backend
  # ===========================================
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: martin-coder-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://martin:${POSTGRES_PASSWORD:-martin_password}@postgres:5432/martin_coder
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LMSTUDIO_URL=${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - SECRET_KEY=${SECRET_KEY}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - SANDBOX_ENABLED=true
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - martin-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===========================================
  # Web Frontend
  # ===========================================
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: martin-coder-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8000}
      - NEXT_PUBLIC_WS_URL=ws://localhost:${API_PORT:-8000}
    depends_on:
      - api
    networks:
      - martin-network

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: martin-coder-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=martin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-martin_password}
      - POSTGRES_DB=martin_coder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martin -d martin_coder"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - martin-network

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: martin-coder-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - martin-network

  # ===========================================
  # Sandbox Runner (for code execution)
  # ===========================================
  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    container_name: martin-coder-sandbox
    restart: unless-stopped
    privileged: true
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_data:/sandboxes
    depends_on:
      - redis
    networks:
      - martin-network

volumes:
  postgres_data:
  redis_data:
  sandbox_data:

networks:
  martin-network:
    driver: bridge
