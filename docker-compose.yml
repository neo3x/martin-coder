# MARTIN-CODER v2.0 — TypeScript/Bun Stack
# No PostgreSQL. No Redis. Just SQLite + Bun.
#
# Quick start:
#   cp .env.example .env   (fill in SECRET_KEY and API keys)
#   docker compose up -d

services:
  # ── API Server (Hono + Bun) ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: martin-coder-api:2.0
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/martin-coder.db
      WORKSPACE_ROOT: /workspace
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - db_data:/data
      - ./:/workspace
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 256m
          cpus: "0.25"

  # ── Web (Next.js) ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: martin-coder-web:2.0
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3005:3005"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"
        reservations:
          memory: 128m
          cpus: "0.1"

volumes:
  db_data:
    driver: local

networks:
  default:
    name: martin-network
