[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "martin-coder-cli"
version = "0.1.0"
description = "AI-powered code generation and editing CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Martin-Coder Team"}
]
keywords = ["ai", "code", "llm", "cli", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.41",
    "prompt-toolkit>=3.0.43",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "black>=24.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
martin-coder = "martin_coder.main:app"
mc = "martin_coder.main:app"

[project.urls]
Homepage = "https://github.com/neo3x/martin-coder"
Documentation = "https://github.com/neo3x/martin-coder#readme"
Repository = "https://github.com/neo3x/martin-coder"

[tool.setuptools.packages.find]
where = ["."]
include = ["martin_coder*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
