# MARTIN-CODER v2.0 — Development Configuration
# TypeScript/Bun Stack — SQLite (no PostgreSQL/Redis needed)
#
# Quick start:
#   cp .env.example .env   (fill in SECRET_KEY and API keys)
#   docker compose -f docker-compose.dev.yml up -d
#
# Or use: martin.bat start (with docker-compose.dev.yml as override)

services:
  # ===========================================
  # API Backend (Development - Bun + Hono)
  # ===========================================
  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    container_name: martin-coder-api-dev
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/data/martin-coder.db
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-3000}
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-3000}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-min-32-characters-long}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LSP_ENABLED=${LSP_ENABLED:-true}
      - MCP_ENABLED=${MCP_ENABLED:-true}
    volumes:
      - ./packages/api/src:/app/packages/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - dev_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - martin-network-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===========================================
  # Web Frontend (Development - Next.js)
  # ===========================================
  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    container_name: martin-coder-web-dev
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${PORT:-8000}
      - NEXT_PUBLIC_WS_URL=ws://localhost:${PORT:-8000}
      - WATCHPACK_POLLING=true
    volumes:
      - ./packages/web/app:/app/packages/web/app
      - ./packages/web/components:/app/packages/web/components
      - ./packages/web/lib:/app/packages/web/lib
      - ./packages/web/messages:/app/packages/web/messages
      - ./packages/web/public:/app/packages/web/public
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      api:
        condition: service_healthy
    networks:
      - martin-network-dev

volumes:
  dev_data:
    driver: local

networks:
  martin-network-dev:
    driver: bridge
