version: '3.8'

# Development configuration with hot reload

services:
  # ===========================================
  # API Backend (Development)
  # ===========================================
  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    container_name: martin-coder-api-dev
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://martin:martin_password@postgres:5432/martin_coder
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LMSTUDIO_URL=${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - DEBUG=true
      - ENVIRONMENT=development
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - martin-network-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===========================================
  # Web Frontend (Development)
  # ===========================================
  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    container_name: martin-coder-web-dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8000}
      - NEXT_PUBLIC_WS_URL=ws://localhost:${API_PORT:-8000}
      - WATCHPACK_POLLING=true
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - api
    networks:
      - martin-network-dev

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: martin-coder-postgres-dev
    environment:
      - POSTGRES_USER=martin
      - POSTGRES_PASSWORD=martin_password
      - POSTGRES_DB=martin_coder
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martin -d martin_coder"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - martin-network-dev

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: martin-coder-redis-dev
    command: redis-server
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - martin-network-dev

  # ===========================================
  # Adminer (Database UI)
  # ===========================================
  adminer:
    image: adminer:latest
    container_name: martin-coder-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - martin-network-dev

  # ===========================================
  # Redis Commander (Redis UI)
  # ===========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: martin-coder-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - martin-network-dev

volumes:
  postgres_data_dev:

networks:
  martin-network-dev:
    driver: bridge
